services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markethub"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/markethub
      DB_USER: markethub
      DB_PASSWORD: markethub
      JWT_SECRET: please-change-this-secret-in-production-0123456789
    ports:
      - "8080:8080"

volumes:
  pgdata:
