spring:
  application:
    name: markethub
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/markethub}
    username: ${DB_USER:markethub}
    password: ${DB_PASSWORD:markethub}
  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет только Flyway
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}

app:
  jwt:
    # В продакшене обязательно задать через переменную окружения (минимум 32 символа)
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-1234567890}
    ttl: ${JWT_TTL:PT2H}
    issuer: markethub
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-email: ${ADMIN_EMAIL:admin@markethub.local}
    manager-username: ${MANAGER_USERNAME:manager}
    manager-password: ${MANAGER_PASSWORD:manager123}
    manager-email: ${MANAGER_EMAIL:manager@markethub.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,flyway
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: MarketHub
    description: REST API интернет-магазина
    version: 1.0.0

logging:
  file:
    name: logs/markethub.log
  pattern:
    # requestId кладёт в MDC RequestLoggingFilter
    level: "%5p [%X{requestId:-system}]"
  level:
    root: INFO
    com.markethub: DEBUG
    org.hibernate.SQL: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

---
# Профиль для быстрого запуска без PostgreSQL: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:markethub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
logging:
  level:
    org.hibernate.SQL: DEBUG
